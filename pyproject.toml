[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "Autonomous coding agent scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flask>=3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
coding-agent = "coding_agent.main:main"
coding-agent-ui = "coding_agent.web_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_agent = ["templates/*.html"]
